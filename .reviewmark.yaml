---
# ReviewMark Configuration File
# This file defines which files require review, where the evidence store is located,
# and how files are grouped into named review-sets following hierarchical scope principles.

# Patterns identifying all files that require review.
# Processed in order; prefix a pattern with '!' to exclude.
needs-review:
  - "README.md"                   # Root README file
  - "requirements.yaml"           # Root requirements file
  - "**/*.cs"                     # All C# source and test files
  - "docs/reqstream/**/*.yaml"    # Requirements files
  - "docs/design/**/*.md"         # Design documentation files
  - "docs/verification/**/*.md"   # Verification documentation files
  - "docs/user_guide/**/*.md"     # User guide documentation
  - "docs/sysml2/**/*.sysml"      # SysML2 architecture model
  - "src/**/Help/**"              # Built-in help cards
  - "!**/obj/**"                  # Exclude build output
  - "!**/bin/**"                  # Exclude build output
  - "!node_modules/**"            # Exclude npm dependencies
  - "!**/.venv/**"                # Exclude Python virtual environment

# Evidence source: review data and index.json are located in the 'reviews' branch
# of this repository, accessed through the GitHub public HTTPS raw content access.
# Note: The 'reviews' branch must be created and populated with review evidence PDFs
# and an index.json before enforcement (--enforce flag) can be enabled in the pipeline.
evidence-source:
  type: url
  location: https://raw.githubusercontent.com/demaconsulting/TemplateDotNetTool/reviews/index.json

# Context included for all reviews.
context:
  - docs/design/introduction.md

# Review sets following hierarchical scope principles.
# Each review-set focuses on a single compliance question with manageable file counts.
reviews:
  # Purpose
  - id: Purpose
    title: Review that README and User Guide are Coherent and Complete
    context:
      - "!docs/design/introduction.md"
    paths:
      - "README.md"
      - "docs/user_guide/**/*.md"

  # Decomposition Review (only one per repository)
  - id: Decomposition
    title: Review that TemplateDotNetTool Decomposition Addresses the Stated Purpose
    context:
      - README.md
      - "docs/user_guide/**/*.md"
    paths:
      - requirements.yaml
      - docs/reqstream/quality.yaml
      - docs/design/introduction.md
      - "docs/sysml2/**/*.sysml"

  # TemplateTool - Specials
  - id: TemplateTool-Architecture
    title: Review that TemplateDotNetTool Architecture Satisfies Requirements
    context:
      - README.md
      - "docs/user_guide/**/*.md"
    paths:
      - "docs/reqstream/template-dot-net-tool.yaml"
      - "docs/design/introduction.md"
      - "docs/design/template-dot-net-tool.md"
      - "docs/verification/introduction.md"
      - "docs/verification/template-dot-net-tool.md"
      - "test/**/IntegrationTests.cs"

  - id: TemplateTool-Design
    title: Review that TemplateDotNetTool Design is Consistent and Complete
    context:
      - docs/reqstream/template-dot-net-tool.yaml
    paths:
      - "docs/reqstream/template-dot-net-tool/platform-requirements.yaml"
      - "docs/design/introduction.md"
      - "docs/design/template-dot-net-tool/**/*.md"
      - "docs/design/ots.md"
      - "docs/verification/ots.md"

  - id: TemplateTool-AllRequirements
    title: Review that All TemplateDotNetTool Requirements are Complete
    context:
      - docs/design/template-dot-net-tool.md
      - docs/reqstream/template-dot-net-tool.yaml
    paths:
      - "docs/reqstream/template-dot-net-tool/**/*.yaml"

  # TemplateTool - Program
  - id: TemplateTool-Program
    title: Review that TemplateDotNetTool Program Implementation is Correct
    context:
      - docs/design/template-dot-net-tool.md
      - docs/reqstream/template-dot-net-tool.yaml
    paths:
      - "docs/reqstream/template-dot-net-tool/program.yaml"
      - "docs/design/template-dot-net-tool/program.md"
      - "docs/verification/template-dot-net-tool/program.md"
      - "src/**/Program.cs"
      - "test/**/ProgramTests.cs"

  # TemplateTool - Cli
  - id: TemplateTool-Cli
    title: Review that TemplateDotNetTool Cli Satisfies Subsystem Requirements
    context:
      - docs/design/template-dot-net-tool.md
      - docs/reqstream/template-dot-net-tool.yaml
    paths:
      - "docs/reqstream/template-dot-net-tool/cli.yaml"
      - "docs/design/template-dot-net-tool/cli.md"
      - "docs/verification/template-dot-net-tool/cli.md"
      - "test/**/Cli/CliSubsystemTests.cs"

  - id: TemplateTool-Cli-Context
    title: Review that TemplateDotNetTool Cli Context Implementation is Correct
    context:
      - docs/design/template-dot-net-tool.md
      - docs/reqstream/template-dot-net-tool.yaml
      - docs/design/template-dot-net-tool/cli.md
      - docs/reqstream/template-dot-net-tool/cli.yaml
    paths:
      - "docs/reqstream/template-dot-net-tool/cli/context.yaml"
      - "docs/design/template-dot-net-tool/cli/context.md"
      - "docs/verification/template-dot-net-tool/cli/context.md"
      - "src/**/Cli/Context.cs"
      - "test/**/Cli/ContextTests.cs"

  - id: TemplateTool-Cli-HelpCommand
    title: Review that TemplateDotNetTool Cli HelpCommand Implementation is Correct
    context:
      - docs/design/template-dot-net-tool.md
      - docs/reqstream/template-dot-net-tool.yaml
      - docs/design/template-dot-net-tool/cli.md
      - docs/reqstream/template-dot-net-tool/cli.yaml
    paths:
      - "docs/reqstream/template-dot-net-tool/cli/help-command.yaml"
      - "docs/design/template-dot-net-tool/cli/help-command.md"
      - "docs/verification/template-dot-net-tool/cli/help-command.md"
      - "src/**/Cli/HelpCommand.cs"
      - "src/**/Help/**"
      - "test/**/Cli/HelpCommandTests.cs"

  # TemplateTool - SelfTest
  - id: TemplateTool-SelfTest
    title: Review that TemplateDotNetTool SelfTest Satisfies Subsystem Requirements
    context:
      - docs/design/template-dot-net-tool.md
      - docs/reqstream/template-dot-net-tool.yaml
    paths:
      - "docs/reqstream/template-dot-net-tool/self-test.yaml"
      - "docs/design/template-dot-net-tool/self-test.md"
      - "docs/verification/template-dot-net-tool/self-test.md"
      - "test/**/SelfTest/SelfTestSubsystemTests.cs"

  - id: TemplateTool-SelfTest-Validation
    title: Review that TemplateDotNetTool SelfTest Validation Implementation is Correct
    context:
      - docs/design/template-dot-net-tool.md
      - docs/reqstream/template-dot-net-tool.yaml
      - docs/design/template-dot-net-tool/self-test.md
      - docs/reqstream/template-dot-net-tool/self-test.yaml
    paths:
      - "docs/reqstream/template-dot-net-tool/self-test/validation.yaml"
      - "docs/design/template-dot-net-tool/self-test/validation.md"
      - "docs/verification/template-dot-net-tool/self-test/validation.md"
      - "src/**/SelfTest/Validation.cs"
      - "test/**/SelfTest/ValidationTests.cs"

  # TemplateTool - Utilities
  - id: TemplateTool-Utilities
    title: Review that TemplateDotNetTool Utilities Satisfies Subsystem Requirements
    context:
      - docs/design/template-dot-net-tool.md
      - docs/reqstream/template-dot-net-tool.yaml
    paths:
      - "docs/reqstream/template-dot-net-tool/utilities.yaml"
      - "docs/design/template-dot-net-tool/utilities.md"
      - "docs/verification/template-dot-net-tool/utilities.md"
      - "test/**/Utilities/UtilitiesSubsystemTests.cs"

  - id: TemplateTool-Utilities-PathHelpers
    title: Review that TemplateDotNetTool Utilities PathHelpers Implementation is Correct
    context:
      - docs/design/template-dot-net-tool.md
      - docs/reqstream/template-dot-net-tool.yaml
      - docs/design/template-dot-net-tool/utilities.md
      - docs/reqstream/template-dot-net-tool/utilities.yaml
    paths:
      - "docs/reqstream/template-dot-net-tool/utilities/path-helpers.yaml"
      - "docs/design/template-dot-net-tool/utilities/path-helpers.md"
      - "docs/verification/template-dot-net-tool/utilities/path-helpers.md"
      - "src/**/Utilities/PathHelpers.cs"
      - "test/**/Utilities/PathHelpersTests.cs"

  # OTS Items
